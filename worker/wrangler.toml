# 정스카이 백엔드 워커 — RSS 수집 + 작업사례 API
name = "jungsky-worker"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Neon PostgreSQL 연결 문자열은 코드/설정에 절대 커밋하지 않는다.
# 배포 전: wrangler secret put DATABASE_URL
# 로컬 개발: .dev.vars 파일에 DATABASE_URL=... (이 파일은 .gitignore 대상)

# RSS 자동 수집 주기 (DB 연동 게이트에서 활성화 예정)
# [triggers]
# crons = ["0 20 * * *"]  # 매일 새벽 5시 KST (UTC 20시)
